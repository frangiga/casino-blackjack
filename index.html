<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Blackjack</title>
  <style>
    /* Estilos generales del contenedor y la mesa */
    body {
      font-family: Arial, sans-serif;
      background-color: #1e272c;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    /* Marco principal del juego */
    .main-frame {
      background-color: #2c3e50;
      border: 3px solid #34495e;
      border-radius: 12px;
      padding: 20px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      box-sizing: border-box;
      text-align: center;
    }

    /* 1. Regla para ocultar el banner */
    .hidden {
      display: none !important;
    }

    /* 2. Banner de fin de juego encuadrado */
    .final-banner {
      width: 100%;
      box-sizing: border-box;
      margin: 15px auto;
      padding: 12px 15px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      word-wrap: break-word; /* Protección anti-desbordamiento */
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.3s ease-in-out;
    }

    /* Colores según el resultado */
    .final-banner.win {
      background-color: #2e7d32;
      color: #ffffff;
      border: 2px solid #a5d6a7;
    }

    .final-banner.lose {
      background-color: #c62828;
      color: #ffffff;
      border: 2px solid #ef9a9a;
    }

    .final-banner.draw {
      background-color: #f57f17;
      color: #ffffff;
      border: 2px solid #ffe082;
    }

    /* Animación de entrada */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- MARCO PRINCIPAL DEL JUEGO -->
  <div class="main-frame">
    <h2>Blackjack</h2>
    <p>Partida: <span id="round-display">1</span> / 10</p>

    <!-- ZONA DEL BANNER DE RESULTADO FINAL (Oculto por defecto) -->
    <div id="final-banner" class="final-banner hidden">
      <span id="final-message"></span>
    </div>

    <!-- Resto de elementos de tu juego (Cartas, puntuación, etc.) -->
    <div id="game-board">
      <!-- Aquí van tus componentes actuales del tablero -->
    </div>
  </div>

  <!-- LÓGICA DEL JUEGO -->
  <script>
    // Configuración a 10 rondas
    const TOTAL_ROUNDS = 10;
    let currentRound = 1;
    let userScore = 0;
    let dealerScore = 0;

    // Función para verificar si terminó el juego tras 10 partidas
    function checkGameOver() {
      if (currentRound > TOTAL_ROUNDS) {
        const banner = document.getElementById('final-banner');
        const message = document.getElementById('final-message');

        // Limpiamos estados anteriores por si acaso
        banner.classList.remove('hidden', 'win', 'lose', 'draw');

        // Evaluación del resultado
        if (userScore > dealerScore) {
          message.textContent = '🎉 ¡¡¡ENHORABUENA! HAS GANADO !!! 🎉';
          banner.classList.add('win');
        } else if (userScore < dealerScore) {
          message.textContent = '❌ ¡HAS PERDIDO LA PARTIDA! ❌';
          banner.classList.add('lose');
        } else {
          message.textContent = '🤝 ¡EMPATE TÉCNICO! 🤝';
          banner.classList.add('draw');
        }

        disableGameButtons();
      }
    }

    function disableGameButtons() {
      // Tu lógica para deshabilitar botones al finalizar
    }

    function resetGame() {
      // Ocultar el banner al reiniciar
      document.getElementById('final-banner').classList.add('hidden');
      currentRound = 1;
      userScore = 0;
      dealerScore = 0;
      document.getElementById('round-display').textContent = currentRound;
    }
  </script>
</body>
</html>
