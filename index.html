<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Casino Blackjack - fran_giga</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Evita cualquier tipo de scroll global */
      background: #0a1f0a;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      padding: 10px 10px 5px 10px;
    }

    #blackjack-console {
      background: #0f380f;
      padding: 15px;
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      border: 1px solid #1b5e20;
      box-sizing: border-box;
      margin: auto 0; /* Centrado vertical automático dentro del viewport */
    }

    .series-tracker {
      background: #082108;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid #2e7d32;
      display: flex;
      justify-content: space-around;
      font-weight: bold;
    }

    .score-badge {
      color: #ffd700;
      font-size: 1.1em;
    }

    .game-board { 
      display: flex; 
      justify-content: space-around; 
      margin: 10px 0; 
      gap: 10px; 
    }

    /* Tapetes con marco amarillo/dorado impecable */
    .hand { 
      background: #1b5e20; 
      padding: 8px; 
      border-radius: 8px; 
      width: 45%; 
      min-height: 95px; 
      border: 2px solid #ffd700; 
      box-sizing: border-box;
    }

    .card-item {
      display: inline-block;
      background: #ffffff;
      padding: 4px 6px;
      margin: 2px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.9em;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }

    button {
      padding: 8px 14px;
      margin: 4px;
      background: #ffd700;
      color: #000;
      border: none;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
      font-size: 0.9em;
    }

    button:hover { background: #ffca28; }
    button:disabled { background: #555; color: #888; cursor: not-allowed; }

    /* Estándar de Firma a Pie de Página */
    footer {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 5px 2px 5px;
      font-size: 0.8em;
      box-sizing: border-box;
    }

    footer a {
      color: #888;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    footer a:hover {
      color: #ffd700;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div id="blackjack-console">
  <h2 style="margin-top:0; margin-bottom:10px; font-size:1.3em;">♠️ Casino Blackjack ♣️</h2>
  
  <!-- Marcador global de victorias (0/10) -->
  <div class="series-tracker">
    <div>Banca: <span id="dealer-wins" class="score-badge">0/10</span></div>
    <div>Jugador: <span id="player-wins" class="score-badge">0/10</span></div>
  </div>

  <p id="status-msg" style="color: #ffd700; font-weight: bold; margin: 8px 0; font-size: 0.9em;">¡Consigue 10 victorias para ganar!</p>
  
  <div class="game-board">
    <div class="hand">
      <h3 style="margin:0 0 6px 0; font-size:0.9em;">Banca: <span id="dealer-score">0</span></h3>
      <div id="dealer-cards"></div>
    </div>
    <div class="hand">
      <h3 style="margin:0 0 6px 0; font-size:0.9em;">Tu Mano: <span id="player-score">0</span></h3>
      <div id="player-cards"></div>
    </div>
  </div>

  <div>
    <button id="btn-hit" onclick="drawCard()">Pedir Carta</button>
    <button id="btn-stand" onclick="stand()">Plantarse</button>
    <button id="btn-next-round" onclick="startNewRound()" style="display:none; background:#ff9800; color:#fff;">Siguiente Mano</button>
    <button id="btn-reset-match" onclick="resetMatch()" style="display:none; background:#d32f2f; color:#fff;">Reiniciar Partida</button>
  </div>

  <!-- Premio final en 1 SOLA LÍNEA e insensible al ancho -->
  <div id="final-reward" style="display:none; margin-top:12px; padding:10px; border:2px solid #2e7d32; background:#1b3e1b; border-radius:8px;">
    <h3 style="color:#4caf50; margin-top:0; margin-bottom:4px; font-size: clamp(0.7rem, 3.2vw, 0.95rem); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">🎉 ¡¡¡ENHORABUENA! HAS GANADO !!! 🎉</h3>
    <p style="margin:3px 0; font-size:0.85em;">La clave para el certitude es:</p>
    <p style="font-size:1.1em; color:#ffd700; margin:0;"><strong>HAGAN-JUEGO-777</strong></p>
  </div>
</div>

<!-- Pie de página con firma oficial para repositorios -->
<footer>
  <a href="https://www.geocaching.com/plan/lists/BMFC2Z7" target="_blank" rel="noopener noreferrer">GeoPaterna</a>
  <a href="https://www.geocaching.com/p/?guid=8aa34b6e-769c-42e2-ab66-4163f9a40e13&wid=9b106a24-4eef-41ab-8a06-c207d4143cb1&ds=2" target="_blank" rel="noopener noreferrer">fran_giga</a>
</footer>

<script>
  var TARGET_WINS = 10;
  var playerScore = 0;
  var dealerScore = 0;
  var playerWins = 0;
  var dealerWins = 0;
  var roundOver = false;

  var suits = [
    { symbol: '♠', color: '#111111' },
    { symbol: '♣', color: '#111111' },
    { symbol: '♥', color: '#d32f2f' },
    { symbol: '♦', color: '#d32f2f' }
  ];

  var cardDeck = [
    { name: '2', value: 2 }, { name: '3', value: 3 }, { name: '4', value: 4 },
    { name: '5', value: 5 }, { name: '6', value: 6 }, { name: '7', value: 7 },
    { name: '8', value: 8 }, { name: '9', value: 9 }, { name: '10', value: 10 },
    { name: 'J', value: 10 }, { name: 'Q', value: 10 }, { name: 'K', value: 10 }, { name: 'A', value: 11 }
  ];

  function getRandomCard() {
    var randomCard = cardDeck[Math.floor(Math.random() * cardDeck.length)];
    var randomSuit = suits[Math.floor(Math.random() * suits.length)];
    return { name: randomCard.name, value: randomCard.value, suit: randomSuit.symbol, color: randomSuit.color };
  }

  function appendCardToHTML(containerId, card) {
    var container = document.getElementById(containerId);
    var cardSpan = document.createElement('span');
    cardSpan.className = 'card-item';
    cardSpan.style.color = card.color;
    cardSpan.innerText = card.name + card.suit;
    container.appendChild(cardSpan);
  }

  function updateScoreboard() {
    document.getElementById('player-wins').innerText = playerWins + '/' + TARGET_WINS;
    document.getElementById('dealer-wins').innerText = dealerWins + '/' + TARGET_WINS;
  }

  function resetMatch() {
    playerWins = 0;
    dealerWins = 0;
    updateScoreboard();
    document.getElementById('final-reward').style.display = 'none';
    document.getElementById('btn-reset-match').style.display = 'none';
    startNewRound();
  }

  function startNewRound() {
    playerScore = 0;
    dealerScore = 0;
    roundOver = false;

    document.getElementById('player-cards').innerHTML = '';
    document.getElementById('dealer-cards').innerHTML = '';
    document.getElementById('player-score').innerText = '0';
    document.getElementById('dealer-score').innerText = '0';
    
    document.getElementById('btn-hit').disabled = false;
    document.getElementById('btn-stand').disabled = false;
    document.getElementById('btn-next-round').style.display = 'none';
    document.getElementById('status-msg').innerText = '¡Haz tu jugada!';

    // Carta inicial al jugador
    drawCard();
  }

  function drawCard() {
    if (roundOver) return;
    var card = getRandomCard();
    playerScore += card.value;
    appendCardToHTML('player-cards', card);
    document.getElementById('player-score').innerText = playerScore;

    if (playerScore > 21) {
      document.getElementById('status-msg').innerText = '¡Te pasaste de 21! Punto para la banca.';
      endRound(false);
    }
  }

  function stand() {
    if (roundOver) return;

    // La banca pide carta hasta sumar 17 o más
    while (dealerScore < 17) {
      var card = getRandomCard();
      dealerScore += card.value;
      appendCardToHTML('dealer-cards', card);
    }

    document.getElementById('dealer-score').innerText = dealerScore;

    if (dealerScore > 21) {
      document.getElementById('status-msg').innerText = '¡La banca se pasó de 21! Punto para ti.';
      endRound(true);
    } else if (playerScore > dealerScore) {
      document.getElementById('status-msg').innerText = '¡Tu mano supera a la banca! Punto para ti.';
      endRound(true);
    } else if (playerScore === dealerScore) {
      document.getElementById('status-msg').innerText = 'Empate. Punto para la banca.';
      endRound(false);
    } else {
      document.getElementById('status-msg').innerText = 'La banca gana la mano con ' + dealerScore + '.';
      endRound(false);
    }
  }

  function endRound(playerWonRound) {
    roundOver = true;
    document.getElementById('btn-hit').disabled = true;
    document.getElementById('btn-stand').disabled = true;

    if (playerWonRound) {
      playerWins++;
    } else {
      dealerWins++;
    }

    updateScoreboard();

    // Comprobar si alguien ha alcanzado las 10 victorias
    if (playerWins === TARGET_WINS) {
      document.getElementById('status-msg').innerText = '¡HAS GANADO LA PARTIDA!';
      document.getElementById('final-reward').style.display = 'block';
    } else if (dealerWins === TARGET_WINS) {
      document.getElementById('status-msg').innerText = 'La banca ha alcanzado 10 victorias. ¡Has perdido!';
      document.getElementById('btn-reset-match').style.display = 'inline-block';
    } else {
      // La partida continúa
      document.getElementById('btn-next-round').style.display = 'inline-block';
    }
  }

  // Arrancar el juego al cargar
  resetMatch();
</script>

</body>
</html>
